<script>
/* ================= Pusula v2 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

    const j = await r.json().catch(() => ({}));

}

/* ---------- Mailler ---------- */
function quality(d) {
  const l = leadById(d.leadId) || {};
  const body = d.body || "", subj = d.subject || "";
  const sig = sigFor(l);
  const main = sig && body.includes(sig) ? body.slice(0, body.indexOf(sig)) : body.split((sig || "").split("\n")[0] || "\u0000")[0];
  const words = (main.match(/\S+/g) || []).length;
  const issues = []; let s = 100;
  const lim = ["f1", "f2", "close"].includes(d.type) ? [30, 120] : [60, 200];
  if (words < lim[0]) { s -= 8; issues.push(["Çok kısa (" + words + " kelime)", false]); }
  else if (words > lim[1]) { s -= 15; issues.push([`Uzun: ${words} kelime, ${lim[1]}'ün altına inin`, false]); } else issues.push([`Uzunluk iyi (${words} kelime)`, true]);
  if (subj.length > 60 || subj.split(/\s+/).length > 9) { s -= 10; issues.push(["Konu satırı uzun (60 karakter / 9 kelime altı önerilir)", false]); } else issues.push(["Konu satırı kısa", true]);
  if (/^(re|fw|fwd):/i.test(subj) && d.type === "intro") { s -= 15; issues.push(["İlk mailde 'Re:' / 'Fwd:' yanıltıcı sayılır", false]); }
  const hay = (subj + " " + main).toLowerCase();
  const names = [l.name, state.profile.company, state.profile.senderName].filter(Boolean).flatMap(n => String(n).split(/[\s()]+/)).filter(w => w.length > 1);
  const plain = names.reduce((t, w) => t.split(w).join(" "), subj + " " + main);
  const hits = TRIGGERS.filter(w => new RegExp("(?<![\\p{L}\\p{N}])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u").test(hay));
  if (hits.length) { s -= Math.min(30, hits.length * 8); issues.push(["Spam kelimesi: " + hits.join(", "), false]); } else issues.push(["Spam tetikleyici kelime yok", true]);
  const links = (main.match(/https?:\/\/|www\./gi) || []).length;
  if (links > 1) { s -= 10; issues.push([links + " bağlantı var; en fazla 1", false]); } else if (links === 1 && d.type === "intro") { s -= 4; issues.push(["İlk mailde bağlantı yerine düz metin daha güvenli", false]); }
  if ((main.match(/!/g) || []).length > 1) { s -= 5; issues.push(["Fazla ünlem", false]); }
  if ((plain.match(/\b[A-ZÇĞİÖŞÜ]{4,}\b/g) || []).filter(w => !["HYXI", "EPC", "ESS", "HVAC", "B2B", "CEO", "MWh", "LUNA"].includes(w)).length > 1) { s -= 10; issues.push(["BÜYÜK HARFLİ kelimeler", false]); }
  if (l.name && !hay.includes(String(l.name).split(/[ (]/)[0].toLowerCase())) { s -= 10; issues.push(["Firmaya özel bir ifade yok", false]); } else issues.push(["Kişiselleştirilmiş", true]);
  if (!OPTOUT_RE.test(body)) { s -= 15; issues.push(["Listeden çıkma cümlesi yok", false]); } else issues.push(["Listeden çıkma cümlesi var", true]);
  if (sigImgOn()) issues.push(["Görsel imza eklenecek", true]);
  else if (state.profile.senderName && !body.includes(state.profile.senderName)) { s -= 5; issues.push(["İmza eksik", false]); }
  if (!isTr(leadLang(l)) && /[ğşıİ]|\b(ve|için|bir|ile)\b/.test(plain)) { s -= 20; issues.push(["Dil karışık: " + leadLang(l) + " mailde Türkçe ifade var", false]); }
  if (isTr(leadLang(l)) && /\b(the|and|we|our|your|with)\b/i.test(plain)) { s -= 20; issues.push(["Dil karışık: Türkçe mailde İngilizce ifade var", false]); }
  if (l.email && !l.verified) { s -= 10; issues.push(["E-posta adresi doğrulanmadı", false]); }
  s = Math.max(0, Math.min(100, s));
  return {s, issues, cls: s >= 80 ? "sc-good" : s >= 60 ? "sc-mid" : "sc-bad"};
}
function qualityHtml(d) {
  const q = quality(d);
  return `<details><summary class="row" style="cursor:pointer;list-style:none"><span class="score ${q.cls}">Teslim puanı <b>${q.s}</b></span><span class="small muted">ayrıntı</span></summary><ul class="issues" style="margin-top:8px">${q.issues.map(([t, ok]) => `<li class="${ok ? "ok" : ""}">${esc(t)}</li>`).join("")}</ul></details>`;
}

/* ---------- Takip ---------- */
function vTakip() {
  const t = todayISO(), w = addDays(t, 7);
  const active = state.leads.filter(l => l.status === "sent" && l.nextAt).sort((a, b) => a.nextAt.localeCompare(b.nextAt));
  const done = state.leads.filter(l => l.status === "sent" && !l.nextAt);
  const sched = state.drafts.filter(d => d.scheduledFor).sort((a, b) => a.scheduledFor.localeCompare(b.scheduledFor));
  const g = [["Gecikmiş", active.filter(l => l.nextAt < t)], ["Bugün", active.filter(l => l.nextAt === t)], ["Bu hafta", active.filter(l => l.nextAt > t && l.nextAt <= w)], ["Daha sonra", active.filter(l => l.nextAt > w)]];
  const hot = state.leads.filter(l => ["reply", "meet"].includes(l.status));
  const item = l => { const nx = seq()[l.step + 1]; return `<div class="tl-item ${l.nextAt < t ? "over" : ""}"><span class="d">${fmtDate(l.nextAt)}</span><span style="flex:1;min-width:0"><button class="nmbtn" data-open="${l.id}" style="background:none;border:0;padding:0;font-weight:600;cursor:pointer;color:var(--fg)">${esc(l.name)}</button> ${stepsBar(l)}<br><span class="small muted">Sıradaki: ${esc(nx?.label || "")} · ilk mail ${fmtDate(l.sentAt)}</span></span>${nextBtn(l)}<button class="btn ghost sm" data-setst="${l.id}:reply">Yanıt geldi</button></div>`; };
  return head("Takip takvimi", `Her firma ${seq().map(s => s.label + (s.day ? ` (+${s.day} gün)` : "")).join(" → ")} dizisiyle izlenir. Yanıt gelen firmada dizi durur.`,
    active.filter(l => l.nextAt <= t && !hasNextDraft(l)).length ? `<button class="btn primary" id="prepDue">Zamanı gelen takipleri hazırla (${active.filter(l => l.nextAt <= t && !hasNextDraft(l)).length})</button>` : "") + `

function classifyLocal(txt) {
  const t = txt.toLowerCase();
  if (/unsubscribe|remove me|stop email|do not contact|don't contact|listeden çıkar|mail atmayın/.test(t)) return {category: "optout", summary: "Listeden çıkmak istiyor."};
  if (/not interested|no thanks|no thank you|not relevant|ilgilenmiyoruz|ihtiyacımız yok/.test(t)) return {category: "no", summary: "İlgilenmiyor."};
  if (/wrong person|not the right|forward(ed)? (it|this) to|doğru kişi değil/.test(t)) return {category: "reply", summary: "Doğru kişiye yönlendirdiler veya başka birini işaret ettiler."};
  if (/later|next (month|quarter|year)|after|şu an değil|ileride/.test(t)) return {category: "later", summary: "Şu an değil, ileride ilgilenebilir."};
  if (/call|meeting|meet|catalog|catalogue|price|quote|offer|send|interested|görüş|fiyat|katalog|teklif/.test(t)) return {category: "reply", summary: "İlgileniyor; bilgi, fiyat veya görüşme istiyor."};
  return {category: "reply", summary: "Yanıt verdi; içeriği kontrol edin."};
}

/* ---------- güvenli gönderim kuyruğu (demo) ---------- */
let queue = [], qTotal = 0, qTimer = null;
function markSent(d) {
  const l = leadById(d.leadId); if (!l) return;
  const t = todayISO();
  if (d.type === "reply") { log(l.id, "Cevap gönderildi"); }
  else {
    const idx = seq().findIndex(s => s.key === d.type);
    if (idx === 0 || !l.sentAt) l.sentAt = t;
    l.step = Math.max(l.step, idx); l.lastSentAt = t;
    const nx = seq()[l.step + 1];
    l.nextAt = nx ? addDays(l.sentAt, nx.day) : "";
    if (!["reply", "meet", "no", "optout"].includes(l.status)) l.status = "sent";
    log(l.id, stepLabel(d.type) + (testOn() ? ` test adresine (${recipientFor(d)})` : "") + " gönderildi");
  }
  state.drafts = state.drafts.filter(x => x.id !== d.id);
}
function startQueue(ids) {
  const sn = state.profile.sending;
  let left = Math.max(0, sn.dailyLimit - sentToday() - queue.length);
  const now = [], later = [];
  for (const id of ids) { if (queue.includes(id)) continue; (left-- > 0 ? now : later).push(id); }
  if (later.length) commit(() => {
    let day = todayISO(), cap = 0;
    for (const id of later) {
      if (cap % sn.dailyLimit === 0) day = nextBusinessDay(day, sn.weekdaysOnly);
      const d = state.drafts.find(x => x.id === id); if (d) { d.scheduledFor = day; const l = leadById(d.leadId); if (l && l.status === "draft") l.status = "scheduled"; }
      cap++;
    }
  });
  if (later.length) toast(`Günlük limit (${sn.dailyLimit}) nedeniyle ${later.length} mail sonraki iş günlerine planlandı.`);
  queue.push(...now);
  if (!now.length) return;
  if (qTimer) { qTotal += now.length; drawQueue(); } else { qTotal = queue.length; tick(); }
}
async function tick() {
  qTimer = qTimer || true;
  const id = queue.shift();
  const d = state.drafts.find(x => x.id === id);
  if (d) {
    if (realMail() && !(await realSend(d))) { queue.length = 0; qTimer = null; $("#layer").querySelector(".queue")?.remove(); return; }
    commit(() => markSent(d));
  }
  drawQueue();
  if (queue.length) qTimer = setTimeout(tick, gapMs());
  else { qTimer = null; setTimeout(() => $("#layer").querySelector(".queue")?.remove(), 1500); toast(realMail() ? `Mailler ${posta.eposta} hesabından gönderildi; sıradaki adımlar takvimde.` : "Mailler gönderildi olarak işaretlendi; sıradaki adımlar takvimde."); }
}
function drawQueue() {
  const done = qTotal - queue.length, sn = state.profile.sending;
  let el = $("#layer").querySelector(".queue");
  if (!el) { el = document.createElement("div"); el.className = "queue"; el.setAttribute("role", "status"); $("#layer").append(el); }
  el.innerHTML = `<span>${done}/${qTotal} gönderildi</span><span class="bar"><i style="width:${done / qTotal * 100}%"></i></span><span class="small" style="opacity:.75">${realMail() ? (testOn() ? "Test: mailler arası 15–30 sn" : `Mailler arası ${sn.minGap}–${sn.maxGap} dk`) : "Demo hızı"} · gerçekte ${sn.minGap}–${sn.maxGap} dk aralık</span>`;
}

/* ---------- görsel imza ---------- */
function loadSigImage(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast("Lütfen PNG veya JPG görsel seçin."); return; }
  if (file.size > 5 * 1024 * 1024) { toast("Görsel 5 MB'den küçük olmalı."); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const w = Math.min(600, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const data = c.toDataURL("image/jpeg", 0.88);
    if (data.length > 400000) { toast("Görsel çok büyük; daha sade bir imza görseli deneyin."); return; }
    commit(() => { state.profile.sigImg = data; if (state.profile.sigMode === "text") state.profile.sigMode = "image"; });
    toast("Görsel imza kaydedildi.");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Görsel okunamadı."); };
  img.src = url;
}

/* ---------- otonom gönderim ----------

document.addEventListener("input", e => {
  const t = e.target, ds = t.dataset;
  if (ds.prof) { state.profile[ds.prof] = t.value; persist(); return; }
  if (ds.snd) { const v = Number(t.value); if (Number.isFinite(v) && v > 0) { state.profile.sending[ds.snd] = v; persist(); } return; }
  if (ds.seqday) { const v = Number(t.value); if (Number.isFinite(v) && v >= 0) { state.profile.sequence[Number(ds.seqday)].day = v; persist(); } return; }
  if (ds.tpl) { const [lang, key, fld] = ds.tpl.split("|"); const P = state.profile; P.templates[lang] = P.templates[lang] || JSON.parse(JSON.stringify(DEFAULT_TPL[lang])); P.templates[lang][key][fld] = t.value; persist(); return; }
  if (t.matches("[data-testadr]")) { state.test.addresses = t.value.split(/[\n,;]/).map(x => x.trim().toLowerCase()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)); persist(); return; }
  if (ds.supp) { state.suppress = t.value.split("\n").map(x => x.trim().toLowerCase()).filter(Boolean); persist(); return; }
  if (ds.lead) { const l = leadById(openLead); if (l) { l[ds.lead] = ds.lead === "email" ? t.value.trim() : t.value; persist(); } return; }
  if (ds.dsub || ds.dbody) {
    const d = state.drafts.find(x => x.id === (ds.dsub || ds.dbody)); if (!d) return;
    if (ds.dsub) d.subject = t.value; else d.body = t.value; persist();
    clearTimeout(qTimerUI); qTimerUI = setTimeout(() => { const box = document.getElementById("q_" + d.id); if (box) { const open = box.querySelector("details")?.open; box.innerHTML = qualityHtml(d); if (open) box.querySelector("details").open = true; } }, 250);
    return;
  }
  if (t.id === "q") { filters.q = t.value; const pos = t.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  const ds = e.target.dataset;
  if (ds.status) { commit(() => { const l = leadById(ds.status); if (l) { l.status = e.target.value; if (["reply", "meet", "no", "optout"].includes(l.status)) l.nextAt = ""; if (l.status === "optout" && l.email && !state.suppress.includes(l.email.toLowerCase())) state.suppress.push(l.email.toLowerCase()); log(l.id, STATUS[l.status].t); } }); }
  if (ds.auto) { commit(() => { state.auto[ds.auto] = Number(e.target.value); }); return; }
  if (e.target.id === "sigFile") { loadSigImage(e.target.files[0]); return; }
  if (e.target.id === "campSel") { filters.campaign = e.target.value; render(); return; }
  if (ds.leadsel) { commit(() => { const l = leadById(openLead); if (l) l[ds.leadsel] = e.target.value; }); return; }
  if (ds.lead || ds.prof) render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { const dlg = $("#layer").querySelector(".dlg-back"); if (dlg) dlg.remove(); else if (openLead) closeLead(); } });

/* ---------- başlangıç ---------- */
if (!SERVER) try { const s = localStorage.getItem("pusula.state"); if (s) state = JSON.parse(s); } catch (e) {}
state = normalize(state);
render(); setStoreNote("Veriler bu tarayıcıda saklanıyor.");
setInterval(() => autoRun(false), 60000); setTimeout(() => autoRun(false), 2500);
(async () => {
  if (SERVER) {
    try {
      const r = await fetch("/api/alan");
      if (r.status === 401) { location.href = "/giris"; return; }
      const j = await r.json();
      srvReady = true; sample = serverSample();
      loadPosta();
      const qp = new URLSearchParams(location.search);
      if (qp.get("ms")) { view = "profil"; render(); setTimeout(() => document.getElementById("baglantilar")?.scrollIntoView({block: "start"}), 100); toast(qp.get("ms") === "baglandi" ? "Outlook hesabınız bağlandı." : "Outlook bağlanamadı: " + (qp.get("neden") || "bilinmeyen hata")); history.replaceState(null, "", "/"); }
      if (j.veri) { state = normalize(j.veri); srvVer = j.surum; render(); } else persist();
      setStoreNote();
    } catch (e) { setStoreNote("Sunucuya bağlanılamadı; değişiklikler kaydedilmeyebilir."); }
    return;
  }
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { sample = s; });
  claude.use("downloads").then(d => { downloads = d; });
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = u ? await u.id() : null;
    if (d && id) {
      docRef = d.collection("data/users/" + id).doc("workspace");
      const snap = await docRef.get();
      if (snap.exists && snap.data()?.profile) { state = normalize(JSON.parse(JSON.stringify(snap.data()))); render(); }
      setStoreNote();
    }
  } catch (e) { setStoreNote("Veriler bu tarayıcıda saklanıyor."); }
})();
</script>
