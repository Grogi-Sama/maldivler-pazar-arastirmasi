<title>Pusula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sol menü + çalışma alanı (masaüstü), alt sekme çubuğu (mobil). Pusula: ince mürekkep, deniz yeşili işaret rengi, kehribar takip rengi. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E8EDEB; --line:#D5DDDA;
  --fg:#16211F; --muted:#5A6B67; --accent:#0E7A6B; --accent-fg:#FFFFFF; --accent-soft:#D6EEEA;
  --amber:#A86A12; --amber-soft:#F6E7CF; --blue:#2D5DA8; --blue-soft:#DCE6F6; --red:#B23A36; --red-soft:#F5DEDC; --grey-soft:#E4E8E7;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,40,36,.06),0 4px 14px rgba(20,40,36,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2825; --line:#2A3834;
  --fg:#E4ECE9; --muted:#93A6A1; --accent:#3DB7A3; --accent-fg:#06211C; --accent-soft:#163B35;
  --amber:#E2A84B; --amber-soft:#3A2D16; --blue:#8DB0EA; --blue-soft:#1C2A42; --red:#EA8C86; --red-soft:#3B1E1C; --grey-soft:#26302E;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2825; --line:#2A3834;
  --fg:#E4ECE9; --muted:#93A6A1; --accent:#3DB7A3; --accent-fg:#06211C; --accent-soft:#163B35;
  --amber:#E2A84B; --amber-soft:#3A2D16; --blue:#8DB0EA; --blue-soft:#1C2A42; --red:#EA8C86; --red-soft:#3B1E1C; --grey-soft:#26302E;
  --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font:700 22px/1 var(--display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav.menu{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.navbtn .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}
main{min-width:0;padding-inline:clamp(16px,3vw,36px);padding-block:22px 96px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:700 clamp(24px,3vw,30px)/1.15 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 18px/1.3 var(--display);margin:0;letter-spacing:-.005em}
h3{font:600 15px/1.3 var(--body);margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.ws{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.demo-tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--amber-soft);color:var(--amber);padding:3px 8px;border-radius:999px}
.grid{display:grid;gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi b{font:700 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=search],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;color:var(--fg)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--bg);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{background:var(--grey-soft);color:var(--muted)}
.st-draft{background:var(--blue-soft);color:var(--blue)}
.st-sent{background:var(--accent-soft);color:var(--accent)}
.st-reply{background:var(--amber-soft);color:var(--amber)}
.st-meet{background:var(--accent);color:var(--accent-fg)}
.st-no{background:var(--red-soft);color:var(--red)}
.prio{font:700 12px var(--mono);width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;flex:none}
.p-A{background:var(--accent);color:var(--accent-fg)} .p-B{background:var(--accent-soft);color:var(--accent)} .p-C{background:var(--grey-soft);color:var(--muted)}
.leads{display:flex;flex-direction:column}
.lead{display:grid;grid-template-columns:22px 24px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead .nm{font-weight:600;overflow-wrap:anywhere}
.lead .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lead .em{font:500 12.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.lead .why{grid-column:3/-1;font-size:13px;color:var(--muted);margin-top:-6px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
.draft{display:grid;gap:10px}
.draft .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.draft textarea{min-height:230px;font-size:13.5px}
.mailto{font:500 13px var(--mono);background:var(--surface-2);padding:2px 7px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.queue{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-size:14px}
.queue .bar{width:120px;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:9px;overflow:hidden;flex:none}
.queue .bar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:40;font-size:14px;max-width:min(420px,calc(100% - 32px))}
.dlg-back{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:14px;padding:20px;max-width:520px;width:100%;display:grid;gap:12px;border:1px solid var(--line)}
.tl{display:grid;gap:16px}
.tl-group h3{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tl-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:6px}
.tl-item .d{font:500 12.5px var(--mono);color:var(--amber);min-width:86px}
.tl-item.over .d{color:var(--red)}
.funnel{display:grid;gap:8px}
.funnel .fr{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.funnel .fb{height:10px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.funnel .fb i{display:block;height:100%;border-radius:9px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note b{color:var(--fg)}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer;font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child{grid-column:1/-1}
  .two,.form{grid-template-columns:minmax(0,1fr)}
  .lead{grid-template-columns:22px 24px minmax(0,1fr) auto}
  .lead .c-seg,.lead .c-em{grid-column:3/-1}
  .lead .why{grid-column:3/-1;margin-top:0}
  .queue{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.drawer-back{position:fixed;inset:0;background:rgba(10,20,18,.4);z-index:45;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;border-left:1px solid var(--line);padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer .x{justify-self:end}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.score{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--body);padding:3px 9px;border-radius:999px}
.score b{font:700 13px var(--mono)}
.sc-good{background:var(--accent-soft);color:var(--accent)} .sc-mid{background:var(--amber-soft);color:var(--amber)} .sc-bad{background:var(--red-soft);color:var(--red)}
.issues{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.issues li.ok{list-style:"✓  ";color:var(--accent)}
.steps{display:flex;gap:4px;align-items:center}
.steps i{width:16px;height:6px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.steps i.next{background:var(--amber)}
.seqgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.seqstep{border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:6px;background:var(--bg)}
.seqstep b{font:600 13px var(--body)}
.seqstep input{width:70px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;flex:none}
.check small{display:block;color:var(--muted);font-size:12.5px}
.meter{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.law{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.law div{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px}
.law b{display:block;font-size:13.5px;margin-bottom:4px}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.guide .card{display:grid;gap:8px;align-content:start}
.guide .n{font:700 13px var(--mono);color:var(--accent)}
.segbars{display:grid;gap:10px}
.segbars .r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 96px;gap:10px;align-items:center;font-size:13px}
.lead .nmbtn{background:none;border:0;padding:0;font-weight:600;text-align:left;cursor:pointer;color:var(--fg);overflow-wrap:anywhere}
.lead .nmbtn:hover{text-decoration:underline}
.sched{font:500 12px var(--mono);color:var(--blue)}
@media (max-width:900px){.seqgrid,.law,.guide{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:100px minmax(0,1fr)}.segbars .r{grid-template-columns:minmax(0,1fr) 96px}.segbars .r .fb{grid-column:1/-1}}

.two{align-items:start}
@media (max-width:900px){.lead .c-st{grid-column:3/-1}}
.auto{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface)}
.auto.off{border-color:var(--amber);background:var(--amber-soft)}
.auto .row{flex-wrap:wrap;gap:8px}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}
</style>

<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M15 5 L19 15 L15 25 L11 15 Z" fill="var(--accent)"/><circle cx="15" cy="15" r="2" fill="var(--surface)"/></svg>
      <div><b>Pusula</b><small>İş geliştirme asistanı</small></div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="foot" id="storeNote">Veriler yükleniyor…</div>
  </aside>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="layer"></div>

<script>
/* ================= Pusula v2 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("tr-TR", {day: "numeric", month: "short", year: "numeric"}) : "—";
const domainOf = e => String(e || "").split("@")[1]?.toLowerCase() || "";
const nextBusinessDay = (iso, weekdaysOnly) => { let d = addDays(iso, 1); if (weekdaysOnly) { while ([0, 6].includes(new Date(d + "T12:00:00").getDay())) d = addDays(d, 1); } return d; };

const STATUS = {
  new:       {t: "Yeni",            c: "st-new"},
  draft:     {t: "Taslak hazır",    c: "st-draft"},
  scheduled: {t: "Planlandı",       c: "st-draft"},
  sent:      {t: "Dizide",          c: "st-sent"},
  reply:     {t: "Yanıt geldi",     c: "st-reply"},
  meet:      {t: "Görüşme",         c: "st-meet"},
  no:        {t: "İlgilenmiyor",    c: "st-no"},
  optout:    {t: "Listeden çıktı",  c: "st-no"},
};
const CONTACTED = ["sent", "reply", "meet", "no", "optout"];
const VIEWS = [
  {id: "panel",   t: "Panel",     i: "M3 12h4l3-8 4 16 3-8h4"},
  {id: "arastir", t: "Araştır",   i: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4.5-4.5"},
  {id: "adaylar", t: "Adaylar",   i: "M4 6h16M4 12h16M4 18h10"},
  {id: "mailler", t: "Mailler",   i: "M3 6h18v12H3zM3 7l9 6 9-6"},
  {id: "takip",   t: "Takip",     i: "M7 3v3M17 3v3M4 8h16M5 5h14v15H5z"},
  {id: "profil",  t: "Ayarlar",   i: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM3 12h2M19 12h2M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"},
];

const DEFAULT_SEQ = [
  {key: "intro", label: "Tanışma",      day: 0},
  {key: "f1",    label: "Hatırlatma 1", day: 3},
  {key: "f2",    label: "Hatırlatma 2", day: 7},
  {key: "close", label: "Kapanış",      day: 14},
];
const DEFAULT_SENDING = {dailyLimit: 30, minGap: 3, maxGap: 8, startHour: 9, endHour: 17, weekdaysOnly: true};
const DEFAULT_AUTO = {on: false, dailyMax: 20, followups: true, intros: false, requireVerified: true, minQuality: 80, since: "", lastRun: "", pausedReason: ""};
const HEALTH = [
  ["spf",    "SPF kaydı tanımlı",                 "Alan adınızın DNS'inde mail sunucunuzu yetkilendirir."],
  ["dkim",   "DKIM imzası açık",                  "Maillerinizin yolda değiştirilmediğini kanıtlar (Outlook/Google Workspace yönetim panelinden açılır)."],
  ["dmarc",  "DMARC kaydı (en az p=none)",        "Gmail, Yahoo ve Microsoft toplu gönderende zorunlu tutuyor."],
  ["unsub",  "Listeden çıkma yolu var",           "Her mailde 'istemiyorsanız yanıtlayın' cümlesi; tam sürümde tek tıkla çıkma bağlantısı."],
  ["warmup", "Gönderen adres en az 3 haftalık",   "Yeni açılmış adreslerden günde 10–25 mail ile başlayın, yavaş artırın."],
  ["domain", "Satış için ayrı alt alan adı",      "Örn. mail.firmaniz.com: ana alan adınızın itibarını korur."],
];
const TRIGGERS = ["free","guarantee","guaranteed","urgent","act now","limited time","no obligation","click here","winner","earn","cash","risk-free","risk free","congratulations","100%","lowest price","buy now","offer expires","ücretsiz","bedava","garantili","acil","hemen","kaçırmayın","son fırsat","tıklayın","kazandınız","indirim","kampanya"];

function normalize(s) {
  s.profile = s.profile || {};
  s.profile.sequence = Array.isArray(s.profile.sequence) && s.profile.sequence.length ? s.profile.sequence : JSON.parse(JSON.stringify(DEFAULT_SEQ));
  s.profile.sending = {...DEFAULT_SENDING, ...(s.profile.sending || {})};
  s.profile.health = s.profile.health || {};
  s.auto = {...DEFAULT_AUTO, ...(s.auto || {})};
  if (s.profile.productsMail === undefined) s.profile.productsMail = "";
  if (s.profile.signatureTr === undefined) s.profile.signatureTr = "";
  if (s.profile.productsShort === undefined) s.profile.productsShort = "";
  if (s.profile.productsShortTr === undefined) s.profile.productsShortTr = "";
  if (!s.profile.templates) s.profile.templates = {};
  if (s.profile.valueMail === undefined) s.profile.valueMail = "";
  s.leads = s.leads || []; s.drafts = s.drafts || []; s.log = s.log || []; s.suppress = s.suppress || [];
  for (const l of s.leads) {
    if (l.step === undefined) l.step = CONTACTED.includes(l.status) ? 0 : -1;
    if (l.nextAt === undefined) l.nextAt = l.followUpAt || "";
    if (!l.legal) l.legal = "B2B – meşru menfaat / tacir istisnası";
    if (l.hook === undefined) l.hook = "";
    if (l.lang === undefined) l.lang = "";
    if (l.campaign === undefined) l.campaign = s.profile.regions || "Genel";
    if (l.verified === undefined) l.verified = !/doğrulanmalı/i.test(l.emailSource || "");
  }
  for (const d of s.drafts) if (d.type === "reminder") d.type = "f1";
  s.version = 2;
  return s;
}

function icon(d) { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`; }
function counts() {
  const t = todayISO();
  const c = {total: state.leads.length, drafts: state.drafts.length, sent: 0, reply: 0, due: 0};
  for (const l of state.leads) {
    if (CONTACTED.includes(l.status)) c.sent++;
    if (["reply", "meet"].includes(l.status)) c.reply++;
    if (l.status === "sent" && l.nextAt && l.nextAt <= t) c.due++;
  }
  return c;
}

function filteredLeads() {
  const q = filters.q.toLowerCase();
  return state.leads.filter(l =>
    (filters.segment === "Tümü" || l.segment === filters.segment) &&
    (filters.status === "Tümü" || l.status === filters.status) &&
    (filters.prio === "Tümü" || l.priority === filters.prio) &&
    (!filters.campaign || filters.campaign === "Tümü" || l.campaign === filters.campaign) &&
    (!q || (l.name + l.region + l.email + l.kind).toLowerCase().includes(q))
  ).sort((a, b) => a.priority.localeCompare(b.priority) || b.score - a.score);
}

function quality(d) {
  const l = leadById(d.leadId) || {};
  const body = d.body || "", subj = d.subject || "";
  const sig = sigFor(l);
  const main = sig && body.includes(sig) ? body.slice(0, body.indexOf(sig)) : body.split((sig || "").split("\n")[0] || "\u0000")[0];
  const words = (main.match(/\S+/g) || []).length;
  const issues = []; let s = 100;
  const lim = ["f1", "f2", "close"].includes(d.type) ? [30, 120] : [60, 200];
  if (words < lim[0]) { s -= 8; issues.push(["Çok kısa (" + words + " kelime)", false]); }
  else if (words > lim[1]) { s -= 15; issues.push([`Uzun: ${words} kelime, ${lim[1]}'ün altına inin`, false]); } else issues.push([`Uzunluk iyi (${words} kelime)`, true]);
  if (subj.length > 60 || subj.split(/\s+/).length > 9) { s -= 10; issues.push(["Konu satırı uzun (60 karakter / 9 kelime altı önerilir)", false]); } else issues.push(["Konu satırı kısa", true]);
  if (/^(re|fw|fwd):/i.test(subj) && d.type === "intro") { s -= 15; issues.push(["İlk mailde 'Re:' / 'Fwd:' yanıltıcı sayılır", false]); }
  const hay = (subj + " " + main).toLowerCase();
  const names = [l.name, state.profile.company, state.profile.senderName].filter(Boolean).flatMap(n => String(n).split(/[\s()]+/)).filter(w => w.length > 1);
  const plain = names.reduce((t, w) => t.split(w).join(" "), subj + " " + main);
  const hits = TRIGGERS.filter(w => new RegExp("(?<![\\p{L}\\p{N}])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "u").test(hay));
  if (hits.length) { s -= Math.min(30, hits.length * 8); issues.push(["Spam kelimesi: " + hits.join(", "), false]); } else issues.push(["Spam tetikleyici kelime yok", true]);
  const links = (main.match(/https?:\/\/|www\./gi) || []).length;
  if (links > 1) { s -= 10; issues.push([links + " bağlantı var; en fazla 1", false]); } else if (links === 1 && d.type === "intro") { s -= 4; issues.push(["İlk mailde bağlantı yerine düz metin daha güvenli", false]); }
  if ((main.match(/!/g) || []).length > 1) { s -= 5; issues.push(["Fazla ünlem", false]); }
  if ((plain.match(/\b[A-ZÇĞİÖŞÜ]{4,}\b/g) || []).filter(w => !["HYXI", "EPC", "ESS", "HVAC", "B2B", "CEO", "MWh", "LUNA"].includes(w)).length > 1) { s -= 10; issues.push(["BÜYÜK HARFLİ kelimeler", false]); }
  if (l.name && !hay.includes(String(l.name).split(/[ (]/)[0].toLowerCase())) { s -= 10; issues.push(["Firmaya özel bir ifade yok", false]); } else issues.push(["Kişiselleştirilmiş", true]);
  if (!OPTOUT_RE.test(body)) { s -= 15; issues.push(["Listeden çıkma cümlesi yok", false]); } else issues.push(["Listeden çıkma cümlesi var", true]);
  if (state.profile.senderName && !body.includes(state.profile.senderName)) { s -= 5; issues.push(["İmza eksik", false]); }
  if (!isTr(leadLang(l)) && /[ğşıİ]|\b(ve|için|bir|ile)\b/.test(plain)) { s -= 20; issues.push(["Dil karışık: " + leadLang(l) + " mailde Türkçe ifade var", false]); }
  if (isTr(leadLang(l)) && /\b(the|and|we|our|your|with)\b/i.test(plain)) { s -= 20; issues.push(["Dil karışık: Türkçe mailde İngilizce ifade var", false]); }
  if (l.email && !l.verified) { s -= 10; issues.push(["E-posta adresi doğrulanmadı", false]); }
  s = Math.max(0, Math.min(100, s));
  return {s, issues, cls: s >= 80 ? "sc-good" : s >= 60 ? "sc-mid" : "sc-bad"};
}
function qualityHtml(d) {

function short(s) { s = String(s || ""); const i = s.search(/[;(]/); return (i > 0 ? s.slice(0, i) : s).trim().slice(0, 60); }

const VARS_HELP = "{firma} · {giris} · {urunler} · {urunler_kisa} · {degerler} · {gonderen} · {sirket} · {ilk_tarih}";
function leadLang(l) { return (l && l.lang) || state.profile.language || "English"; }
function isTr(lang) { return /^t(r|ürkçe|urkish)/i.test(lang || ""); }
function tplFor(lang, key) {
  const set = state.profile.templates?.[lang] || DEFAULT_TPL[lang] || DEFAULT_TPL[isTr(lang) ? "Türkçe" : "English"];
  return set[key] || DEFAULT_TPL[isTr(lang) ? "Türkçe" : "English"][key];
}
function fill(text, l) {
  const p = state.profile, tr = isTr(leadLang(l));

    firma: l.name, giris: l.hook || (tr ? `${l.name} ile ${l.region || "bölgenizdeki"} çalışmalarınız hakkında yazıyorum.` : `I'm reaching out regarding ${l.name}'s work in ${l.region}.`),

function sigFor(l) { const p = state.profile; return isTr(leadLang(l)) ? (p.signatureTr || p.signature) : p.signature; }
function renderTpl(l, key) {

function shortSubj(s) {

function addDraft(l, type) {

/* ---------- yanıt asistanı ---------- */
function classifyLocal(txt) {
  const t = txt.toLowerCase();
  if (/unsubscribe|remove me|stop email|do not contact|don't contact|listeden çıkar|mail atmayın/.test(t)) return {category: "optout", summary: "Listeden çıkmak istiyor."};
  if (/not interested|no thanks|no thank you|not relevant|ilgilenmiyoruz|ihtiyacımız yok/.test(t)) return {category: "no", summary: "İlgilenmiyor."};
  if (/wrong person|not the right|forward(ed)? (it|this) to|doğru kişi değil/.test(t)) return {category: "reply", summary: "Doğru kişiye yönlendirdiler veya başka birini işaret ettiler."};
  if (/later|next (month|quarter|year)|after|şu an değil|ileride/.test(t)) return {category: "later", summary: "Şu an değil, ileride ilgilenebilir."};
  if (/call|meeting|meet|catalog|catalogue|price|quote|offer|send|interested|görüş|fiyat|katalog|teklif/.test(t)) return {category: "reply", summary: "İlgileniyor; bilgi, fiyat veya görüşme istiyor."};
  return {category: "reply", summary: "Yanıt verdi; içeriği kontrol edin."};
}

/* ---------- güvenli gönderim kuyruğu (demo) ---------- */
let queue = [], qTotal = 0, qTimer = null;
function markSent(d) {
  const l = leadById(d.leadId); if (!l) return;
  const t = todayISO();
  if (d.type === "reply") { log(l.id, "Cevap gönderildi"); }
  else {
    const idx = seq().findIndex(s => s.key === d.type);
    if (idx === 0 || !l.sentAt) l.sentAt = t;
    l.step = Math.max(l.step, idx); l.lastSentAt = t;
    const nx = seq()[l.step + 1];
    l.nextAt = nx ? addDays(l.sentAt, nx.day) : "";
    if (!["reply", "meet", "no", "optout"].includes(l.status)) l.status = "sent";
    log(l.id, stepLabel(d.type) + " gönderildi");
  }
  state.drafts = state.drafts.filter(x => x.id !== d.id);
}
function startQueue(ids) {
  const sn = state.profile.sending;
  let left = Math.max(0, sn.dailyLimit - sentToday() - queue.length);
  const now = [], later = [];
  for (const id of ids) { if (queue.includes(id)) continue; (left-- > 0 ? now : later).push(id); }
  if (later.length) commit(() => {
    let day = todayISO(), cap = 0;
    for (const id of later) {
      if (cap % sn.dailyLimit === 0) day = nextBusinessDay(day, sn.weekdaysOnly);
      const d = state.drafts.find(x => x.id === id); if (d) { d.scheduledFor = day; const l = leadById(d.leadId); if (l && l.status === "draft") l.status = "scheduled"; }
      cap++;
    }
  });
  if (later.length) toast(`Günlük limit (${sn.dailyLimit}) nedeniyle ${later.length} mail sonraki iş günlerine planlandı.`);
  queue.push(...now);
  if (!now.length) return;
  if (qTimer) { qTotal += now.length; drawQueue(); } else { qTotal = queue.length; tick(); }
}
function tick() {
  const id = queue.shift();
  const d = state.drafts.find(x => x.id === id);
  if (d) commit(() => markSent(d));
  drawQueue();
  if (queue.length) qTimer = setTimeout(tick, 2200);
  else { qTimer = null; setTimeout(() => $("#layer").querySelector(".queue")?.remove(), 1500); toast("Mailler gönderildi olarak işaretlendi; sıradaki adımlar takvimde."); }
}
function drawQueue() {
  const done = qTotal - queue.length, sn = state.profile.sending;
  let el = $("#layer").querySelector(".queue");
  if (!el) { el = document.createElement("div"); el.className = "queue"; el.setAttribute("role", "status"); $("#layer").append(el); }
  el.innerHTML = `<span>${done}/${qTotal} gönderildi</span><span class="bar"><i style="width:${done / qTotal * 100}%"></i></span><span class="small" style="opacity:.75">Demo hızı · gerçekte ${sn.minGap}–${sn.maxGap} dk aralık</span>`;
}

   kurallara uyan taslakları güvenli tempoda kendisi gönderir. Tam sürümde aynı kurallar sunucudaki
   gönderim motorunda (pusula-sunucu/gonderim-motoru.js) çalışır; tarayıcı kapalıyken de devam eder. */
const isOptoutToday = l => { const t = todayISO(); return l.status === "optout" && state.log.some(x => x.leadId === l.id && x.at.slice(0, 10) === t); };
function autoQuota() { const a = state.auto, sn = state.profile.sending; return Math.max(0, Math.min(a.dailyMax, sn.dailyLimit) - sentToday() - queue.length); }
function inWindow(now = new Date()) { const sn = state.profile.sending, d = now.getDay(), h = now.getHours(); return (!sn.weekdaysOnly || (d > 0 && d < 6)) && h >= sn.startHour && h < sn.endHour; }
function nextWindow(now = new Date()) {

/* ---------- CSV ---------- */
function parseCSV(text) {
  const sep = (text.split("\n")[0].match(/;/g) || []).length > (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; } else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const COLS = {name: ["firma", "name", "company", "şirket", "kurum", "resort"], email: ["e-posta", "eposta", "email", "mail", "e-mail"], website: ["web", "website", "site", "web sitesi"], region: ["bölge", "region", "ülke", "country", "atoll", "şehir", "city"], kind: ["tür", "type", "kind", "kategori"], segment: ["segment"], priority: ["öncelik", "priority"], why: ["neden", "why", "not", "notes", "açıklama"], hook: ["giriş", "hook", "ilk cümle", "opening"], campaign: ["kampanya", "campaign"], lang: ["dil", "language", "lang"]};
function importCSV(text) {
  const rows = parseCSV(text.trim()); if (rows.length < 2) return {n: 0, skip: 0};
  const hdr = rows[0].map(h => h.trim().toLowerCase());
  const idx = {}; for (const [k, names] of Object.entries(COLS)) idx[k] = hdr.findIndex(h => names.some(n => h === n || h.startsWith(n)));
  if (idx.name < 0) idx.name = 0;
  let n = 0, skip = 0;
  const known = new Set(state.leads.map(l => l.name.toLowerCase())), knownMail = new Set(state.leads.map(l => (l.email || "").toLowerCase()).filter(Boolean));
  commit(() => {
    for (const r of rows.slice(1)) {
      const g = k => idx[k] >= 0 ? String(r[idx[k]] || "").trim() : "";
      const name = g("name"); if (!name) continue;
      const email = g("email").toLowerCase();
      if (known.has(name.toLowerCase()) || (email && knownMail.has(email))) { skip++; continue; }
      const pr = g("priority").toUpperCase();
      state.leads.push({id: uid(), name, kind: g("kind") || "Firma", segment: g("segment") || "İçe aktarılan", region: g("region"), website: g("website"), email,
        emailSource: "Kullanıcının içe aktardığı liste", legal: "B2B – meşru menfaat / tacir istisnası", priority: ["A", "B", "C"].includes(pr) ? pr : "B", score: 60, why: g("why"), hook: g("hook"), lang: isTr(g("lang")) ? "Türkçe" : "", campaign: g("campaign") || "İçe aktarılan", verified: !!email, status: "new", step: -1, sentAt: "", lastSentAt: "", nextAt: "", notes: ""});
      known.add(name.toLowerCase()); if (email) knownMail.add(email); n++;
    }
    view = "adaylar"; filters = {segment: "Tümü", status: "Tümü", prio: "Tümü", q: "", campaign: "Tümü"};
  });
  return {n, skip};
}
function exportCSV() {
  const cols = [["Firma", "name"], ["E-posta", "email"], ["Web", "website"], ["Bölge", "region"], ["Tür", "kind"], ["Segment", "segment"], ["Öncelik", "priority"], ["Puan", "score"], ["Durum", l => STATUS[l.status].t], ["Dizi adımı", l => l.step + 1], ["İlk mail", "sentAt"], ["Sıradaki", "nextAt"], ["Neden", "why"], ["Kampanya", "campaign"], ["Dil", l => leadLang(l)], ["E-posta doğrulandı", l => l.verified ? "Evet" : "Hayır"], ["Notlar", "notes"]];
  const cell = v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return "﻿" + [cols.map(c => c[0]).join(";"), ...state.leads.map(l => cols.map(([, k]) => cell(typeof k === "function" ? k(l) : l[k])).join(";"))].join("\n");
}
function importDlg() {
  const back = document.createElement("div"); back.className = "dlg-back";
  back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="CSV içe aktar"><h2>Listenizi içe aktarın</h2>
    <p class="small muted" style="margin:0">Excel'den "CSV" olarak kaydedin ya da tabloyu kopyalayıp aşağıya yapıştırın. İlk satır başlık olmalı: Firma, E-posta, Web, Bölge, Tür, Segment, Öncelik, Neden. Aynı firma iki kez eklenmez.</p>

});
